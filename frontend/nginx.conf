# Static SPA + same-origin /api proxy to the gateway (no CORS needed).
# /api/game/* is a WebSocket (in-match gameplay), so pass the Upgrade handshake through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # The app bundle is ~470 kB of JS + CSS raw, ~130 kB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /api/ {
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }

    # Vite puts a content hash in every file name under /assets: cache those for good. A missing one is a 404,
    # never index.html served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html names the current assets, so it is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
